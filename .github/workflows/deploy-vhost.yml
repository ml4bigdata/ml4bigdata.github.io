name: Deploy site to Aalto vhost

# Builds the Jekyll site and rsyncs it to the webroot of
# machinelearning.aalto.fi (/l/data/machinelearning.aalto.fi on
# webfiles.aalto.fi, reachable only via the kosh jump host).
#
# The deploy key (secret VHOST_SSH_KEY) is restricted in the remote
# ~/.ssh/authorized_keys to a forced `rrsync -wo` command on that one
# directory, plus a port-forward to webfiles:22 for the jump. It gets no
# shell and cannot touch any other vhost.
#
# `workflow_call` exists because pushes made by GITHUB_TOKEN (e.g. the
# meetups updater) do NOT trigger `on: push`. update-meetups.yml therefore
# calls this workflow directly after it commits.

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

# Serialise deploys so two runs never rsync into the webroot at once.
concurrency:
  group: deploy-vhost
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --destination _site

      - name: Configure SSH
        env:
          VHOST_SSH_KEY: ${{ secrets.VHOST_SSH_KEY }}
          VHOST_KNOWN_HOSTS: ${{ secrets.VHOST_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VHOST_SSH_KEY" > ~/.ssh/vhost_ci
          chmod 600 ~/.ssh/vhost_ci
          printf '%s\n' "$VHOST_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'CFG'
          Host kosh
              HostName kosh.aalto.fi
              User junga1
              IdentityFile ~/.ssh/vhost_ci
              IdentitiesOnly yes
              BatchMode yes

          Host webfiles
              HostName webfiles.aalto.fi
              User junga1
              IdentityFile ~/.ssh/vhost_ci
              IdentitiesOnly yes
              BatchMode yes
              ProxyJump kosh
          CFG
          chmod 600 ~/.ssh/config

      - name: Diagnose SSH auth (temporary)
        run: |
          echo "--- key as the runner sees it ---"
          ssh-keygen -lf ~/.ssh/vhost_ci || echo "KEY FAILED TO LOAD"
          echo "--- auth negotiation with kosh ---"
          ssh -vv -o BatchMode=yes -o ConnectTimeout=20 kosh true 2>&1 \
            | grep -E "Offering public key|Server accepts key|Authentications that can continue|Permission denied|Load key|invalid format" \
            | head -20 || true

      - name: Deploy to vhost
        # The forced rrsync command roots the transfer at the vhost webroot,
        # so the destination path is "/". No -p: the remote umask (002) sets
        # permissions. --delete keeps the live site in sync with the build.
        run: rsync -rltvz --delete _site/ webfiles:/

      - name: Verify live site
        run: |
          fail=0
          for path in / /people/ /research/ /teaching/ /meetups/ /assets/css/style.css; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -m 20 \
              "https://machinelearning.aalto.fi${path}")
            echo "${code}  ${path}"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
