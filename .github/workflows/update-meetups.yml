name: Update meetups page from Outlook calendar

on:
  schedule:
    - cron: "0 6 * * *"    # run daily at 06:00 UTC
    - cron: "0 12 * * *"   # run daily at 12:00 UTC
    - cron: "0 18 * * *"   # run daily at 18:00 UTC
  workflow_dispatch:       # allow manual runs

permissions:
  contents: write   # 👈 add this block

jobs:
  update-meetups:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install icalendar requests pytz

      - name: Generate meetups page from Outlook ICS
        env:
          OUTLOOK_ICS_URL: ${{ secrets.OUTLOOK_ICS_URL }}
        run: |
          python scripts/update_meetups_from_ics.py

      - name: Commit and push changes
        id: commit
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git commit -am "Update meetups page from Outlook calendar"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # A push made with GITHUB_TOKEN does not trigger `on: push`, so the site
  # rebuild has to be invoked explicitly here. webfiles then pulls it.
  publish:
    needs: update-meetups
    if: needs.update-meetups.outputs.changed == 'true'
    uses: ./.github/workflows/publish-site-build.yml
